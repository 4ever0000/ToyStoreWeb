<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToyStore.Frontend</title>
    <base href="/" />

    <!-- 📱 PWA (Proqram Kimi Yükləmə) Üçün Vacib Sətirlər -->
    <link href="manifest.json" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />

    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Animasiyalar Kitabxanası (Daha canlı görünüş üçün) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="ToyStore.Frontend.styles.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <!-- Sayt açılan zaman görünən gözəl yüklənmə ekranı -->
        <div class="d-flex flex-column align-items-center justify-content-center" style="height: 100vh;">
            <div class="spinner-grow text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
            <p class="mt-3 fw-bold animate__animated animate__pulse animate__infinite">🧸 ToyStore Dünyası Hazırlanır...</p>
        </div>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 🎉 Konfeti Animasiyası (Sifariş bitəndə istifadə edəcəyik) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <script>
        // 🌑 Gecə/Gündüz Rejimi Funksiyası
        window.setTheme = (theme) => {
            document.documentElement.setAttribute('data-bs-theme', theme);
        };

        // 🛠️ PWA (Service Worker) Qeydiyyatı - Saytın proqram kimi işləməsini təmin edir
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').then(function (registration) {
                console.log('PWA xidməti uğurla qeydiyyatdan keçdi:', registration.scope);
            }).catch(function (error) {
                console.log('PWA qeydiyyat xətası:', error);
            });
        }
    </script>
</body>
</html>
