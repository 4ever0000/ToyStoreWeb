version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}" 
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - storeapi:/var/opt/mssql

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
   
      DB_CONNECTION: "Server=db;Database=ToyStoreDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      JWT_KEY: "${JWT_KEY}"
      JWT_ISSUER: "${JWT_ISSUER}"
      JWT_AUDIENCE: "${JWT_AUDIENCE}"
    depends_on:
      - db

volumes:
  storeapi: